<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title>Nouvelle commande</title>
</head>
<body>
<section layout:fragment="header">
    <h1>Nouvelle commande</h1>
    <ol class="breadcrumb">
        <li><a th:href="@{/dashboard}"><i class="fa fa-dashboard"></i> Home</a></li>
        <li><a th:href="@{/commandes}">Commandes</a></li>
        <li class="active">Nouvelle</li>
    </ol>
</section>
<div layout:fragment="content">
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Créer une commande</h3>
        </div>
        <form th:action="@{/commandes}" th:object="${commande}" method="post">
            <div class="box-body">
                <div class="form-group" th:classappend="${#fields.hasErrors('produitId')} ? 'has-error' : ''">
                    <label for="produitId">Produit</label>
                    <select id="produitId" class="form-control" th:field="*{produitId}" required>
                        <option value="">-- Sélectionner un produit --</option>
                        <option th:each="p : ${produits}" th:value="${p.id}" th:text="${p.nom} + ' (' + ${p.quantite} + ' dispo)'"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('produitId')}" th:errors="*{produitId}" class="help-block"></span>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('quantite')} ? 'has-error' : ''">
                    <label for="quantite">Quantité</label>
                    <input type="number" id="quantite" class="form-control" th:field="*{quantite}" min="1" placeholder="1" required>
                    <span th:if="${#fields.hasErrors('quantite')}" th:errors="*{quantite}" class="help-block"></span>
                </div>
            </div>
            <div class="box-footer">
                <button type="submit" class="btn btn-primary">
                    <i class="fa fa-save"></i> Enregistrer
                </button>
                <a th:href="@{/commandes}" class="btn btn-default">
                    <i class="fa fa-times"></i> Annuler
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
