<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title>Utilisateur</title>
</head>
<body>
<section layout:fragment="header">
    <h1>
        <span th:text="${user != null and user.id != null} ? 'Modifier' : 'Nouvel'"></span> utilisateur
    </h1>
    <ol class="breadcrumb">
        <li><a th:href="@{/dashboard}"><i class="fa fa-dashboard"></i> Home</a></li>
        <li><a th:href="@{/admin/utilisateurs}">Utilisateurs</a></li>
        <li class="active">Formulaire</li>
    </ol>
</section>
<div layout:fragment="content">

    <div class="box box-primary">
        <div class="box-body">

            <!-- Formulaire de création -->
            <form th:if="${user == null or user.id == null}" th:action="@{/admin/utilisateurs}" method="post">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="motDePasse" class="form-control" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" name="nom" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" name="contact" class="form-control">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Créer</button>
                <a th:href="@{/admin/utilisateurs}" class="btn btn-default">Annuler</a>
            </form>

            <!-- Formulaire de modification -->
            <form th:if="${user != null and user.id != null}"
                  th:action="@{/admin/utilisateurs/{id}(id=${user.id})}" method="post">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" class="form-control" th:value="${user.username}" disabled>
                </div>
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" name="nom" class="form-control" th:value="${user.nom}" required>
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <input type="text" name="contact" class="form-control" th:value="${user.contact}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                </div>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/admin/utilisateurs}" class="btn btn-default">Annuler</a>
            </form>

            <!-- Changement de mot de passe (édition uniquement) -->
            <div th:if="${user != null and user.id != null}" style="margin-top: 30px;">
                <h4>Changer le mot de passe</h4>
                <form th:action="@{/admin/utilisateurs/{id}/mot-de-passe(id=${user.id})}" method="post">
                    <div class="form-group">
                        <input type="password" name="nouveauMotDePasse" class="form-control"
                               placeholder="Nouveau mot de passe" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-warning">Changer le mot de passe</button>
                </form>
            </div>

        </div>
    </div>
</div>
</body>
</html>
