<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title th:text="${editId != null} ? 'Modifier Produit' : 'Nouveau Produit'">Formulaire</title>
</head>
<body>
<section layout:fragment="header">
    <h1 th:text="${editId != null} ? 'Modifier Produit' : 'Nouveau Produit'">Formulaire</h1>
    <ol class="breadcrumb">
        <li><a th:href="@{/dashboard}"><i class="fa fa-dashboard"></i> Home</a></li>
        <li><a th:href="@{/produits}">Produits</a></li>
        <li class="active" th:text="${editId != null} ? 'Modifier' : 'Nouveau'">Formulaire</li>
    </ol>
</section>
<div layout:fragment="content">
    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title" th:text="${editId != null} ? 'Modifier le produit' : 'Nouveau produit'">Titre</h3>
        </div>
        <form th:action="${editId} ? '/produits/' + ${editId} : '/produits'" th:object="${produit}" method="post">
            <div class="box-body">
                <div class="form-group" th:classappend="${#fields.hasErrors('nom')} ? 'has-error' : ''">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" class="form-control" th:field="*{nom}" placeholder="Nom du produit" required>
                    <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="help-block"></span>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" th:field="*{description}" placeholder="Description du produit" rows="3"></textarea>
                </div>

                <div class="form-group" th:classappend="${#fields.hasErrors('prixUnitaire')} ? 'has-error' : ''">
                    <label for="prixUnitaire">Prix unitaire (DH)</label>
                    <input type="number" id="prixUnitaire" class="form-control" th:field="*{prixUnitaire}" step="0.01" placeholder="0.00" required>
                    <span th:if="${#fields.hasErrors('prixUnitaire')}" th:errors="*{prixUnitaire}" class="help-block"></span>
                </div>

                <div class="form-group">
                    <label for="quantite">Quantité</label>
                    <input type="number" id="quantite" class="form-control" th:field="*{quantite}" placeholder="0" required>
                </div>
            </div>
            <div class="box-footer">
                <button type="submit" class="btn btn-primary">
                    <i class="fa fa-save"></i> Enregistrer
                </button>
                <a th:href="@{/produits}" class="btn btn-default">
                    <i class="fa fa-times"></i> Annuler
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
