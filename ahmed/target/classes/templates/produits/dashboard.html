<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📊 Dashboard du stock</h2>
        <a th:href="@{/produits}" class="btn btn-outline-secondary">&larr; Retour à la liste</a>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Quantité totale en stock</h6>
                    <h3 th:text="${dashboard.quantiteTotale}"></h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Valeur totale du stock</h6>
                    <h3 th:text="${#numbers.formatDecimal(dashboard.valeurTotaleStock, 1, 2)} + ' DH'"></h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-danger">
                <div class="card-body">
                    <h6 class="text-muted">Produits en rupture (≤ seuil)</h6>
                    <h3 class="text-danger" th:text="${dashboard.nombreProduitsEnRupture}"></h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5>Valeur du stock par produit</h5>
            <canvas id="chartValeur" height="100"></canvas>
        </div>
    </div>

    <div class="card shadow-sm" th:if="${dashboard.nombreProduitsEnRupture > 0}">
        <div class="card-body">
            <h5 class="text-danger">⚠️ Produits en rupture</h5>
            <ul>
                <li th:each="p : ${dashboard.produitsEnRupture}"
                    th:text="${p.nom} + ' — quantité restante : ' + ${p.quantite}"></li>
            </ul>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const produits = /*[[${dashboard.produitsEnRupture}]]*/ [];
    /*]]>*/
</script>
<script th:inline="javascript">
    // Récupère les produits via l'API pour construire le graphique complet
    fetch('/api/produits')
        .then(r => r.json())
        .then(data => {
            const labels = data.map(p => p.nom);
            const valeurs = data.map(p => p.quantite * p.prixUnitaire);
            new Chart(document.getElementById('chartValeur'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Valeur du stock (DH)',
                        data: valeurs,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)'
                    }]
                },
                options: {responsive: true}
            });
        });
</script>
</body>
</html>
