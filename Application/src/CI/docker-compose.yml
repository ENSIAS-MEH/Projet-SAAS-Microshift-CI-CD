services:
  app:
    build:
      context: ../..
      dockerfile: src/CI/DockerFile
    image: ${DOCKER_IMAGE}:${DOCKER_TAG}
    container_name: usine-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/projetweb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: StrongAdminPassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - factory-net

  db:
    image: mysql:8.0
    container_name: factory-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: StrongAdminPassword
      MYSQL_DATABASE: projetweb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../Database/initialisation.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pStrongAdminPassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - factory-net

volumes:
  mysql_data:

networks:
  factory-net:
    driver: bridge