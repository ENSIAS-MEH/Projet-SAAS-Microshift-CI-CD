<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion du Stock — Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 Produits en stock</h2>
        <div>
            <a th:href="@{/produits/dashboard}" class="btn btn-outline-secondary">Dashboard</a>
            <button th:if="${peutAjouter}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProduit"
                    onclick="ouvrirFormulaireAjout()">+ Ajouter un produit</button>
        </div>
    </div>

    <input type="text" id="filtreNom" class="form-control mb-3" placeholder="Rechercher un produit par nom..."
           onkeyup="filtrer()">

    <table class="table table-striped bg-white shadow-sm" id="tableProduits">
        <thead>
        <tr>
            <th>Nom</th>
            <th>Quantité</th>
            <th>Prix unitaire</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produits}" th:attr="data-id=${p.id}">
            <td th:text="${p.nom}"></td>
            <td th:text="${p.quantite}"
                th:classappend="${p.quantite <= 5} ? 'text-danger fw-bold' : ''"></td>
            <td th:text="${#numbers.formatDecimal(p.prixUnitaire, 1, 2)} + ' DH'"></td>
            <td th:text="${p.description}"></td>
            <td>
                <button th:if="${peutModifier}" class="btn btn-sm btn-outline-primary"
                        th:onclick="'ouvrirFormulaireEdition(' + ${p.id} + ')'">Modifier</button>
                <button th:if="${peutSupprimer}" class="btn btn-sm btn-outline-danger"
                        th:onclick="'supprimerProduit(' + ${p.id} + ')'">Supprimer</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal formulaire (ajout / modification) -->
<div class="modal fade" id="modalProduit" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="titreModal">Nouveau produit</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="produitId">
                <div class="mb-2">
                    <label class="form-label">Nom</label>
                    <input type="text" id="nom" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">Quantité</label>
                    <input type="number" id="quantite" class="form-control" min="0">
                </div>
                <div class="mb-2">
                    <label class="form-label">Prix unitaire (DH)</label>
                    <input type="number" id="prixUnitaire" class="form-control" min="0" step="0.01">
                </div>
                <div class="mb-2">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control"></textarea>
                </div>
                <div id="erreurFormulaire" class="text-danger small"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button class="btn btn-primary" onclick="enregistrerProduit()">Enregistrer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function filtrer() {
        const terme = document.getElementById('filtreNom').value.toLowerCase();
        document.querySelectorAll('#tableProduits tbody tr').forEach(tr => {
            const nom = tr.children[0].textContent.toLowerCase();
            tr.style.display = nom.includes(terme) ? '' : 'none';
        });
    }

    function ouvrirFormulaireAjout() {
        document.getElementById('titreModal').textContent = 'Nouveau produit';
        document.getElementById('produitId').value = '';
        document.getElementById('nom').value = '';
        document.getElementById('quantite').value = 0;
        document.getElementById('prixUnitaire').value = 0;
        document.getElementById('description').value = '';
        document.getElementById('erreurFormulaire').textContent = '';
    }

    async function ouvrirFormulaireEdition(id) {
        const res = await fetch(`/api/produits/${id}`);
        const p = await res.json();
        document.getElementById('titreModal').textContent = 'Modifier le produit';
        document.getElementById('produitId').value = p.id;
        document.getElementById('nom').value = p.nom;
        document.getElementById('quantite').value = p.quantite;
        document.getElementById('prixUnitaire').value = p.prixUnitaire;
        document.getElementById('description').value = p.description ?? '';
        new bootstrap.Modal(document.getElementById('modalProduit')).show();
    }

    async function enregistrerProduit() {
        const id = document.getElementById('produitId').value;
        const payload = {
            nom: document.getElementById('nom').value,
            quantite: parseInt(document.getElementById('quantite').value, 10),
            prixUnitaire: parseFloat(document.getElementById('prixUnitaire').value),
            description: document.getElementById('description').value
        };
        const url = id ? `/api/produits/${id}` : '/api/produits';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            location.reload();
        } else {
            const err = await res.json();
            document.getElementById('erreurFormulaire').textContent = err.message || 'Erreur de validation';
        }
    }

    async function supprimerProduit(id) {
        if (!confirm('Supprimer ce produit ?')) return;
        const res = await fetch(`/api/produits/${id}`, {method: 'DELETE'});
        if (res.ok) {
            location.reload();
        } else {
            const err = await res.json();
            alert(err.message || 'Suppression impossible');
        }
    }
</script>
</body>
</html>
