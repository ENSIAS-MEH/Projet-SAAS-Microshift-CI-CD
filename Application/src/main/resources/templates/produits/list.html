<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title>Produits</title>
</head>
<body>
<section layout:fragment="header">
    <h1>
        Produits
        <small>Liste des produits</small>
    </h1>
    <ol class="breadcrumb">
        <li><a th:href="@{/dashboard}"><i class="fa fa-dashboard"></i> Home</a></li>
        <li class="active">Produits</li>
    </ol>
</section>
<div layout:fragment="content">
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="row">
        <div class="col-md-12">
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title">Stock par produit</h3>
                </div>
                <div class="box-body">
                    <canvas id="barChart" height="100" style="max-height: 100px;"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="box">
        <div class="box-header">
            <h3 class="box-title">Liste des produits</h3>
            <div class="box-tools">
                <div class="input-group input-group-sm" style="width: 200px; display: inline-block; vertical-align: middle;">
                    <input type="text" id="searchInput" class="form-control" placeholder="Rechercher...">
                </div>
                <a th:if="${@userSession.isAdmin() or @userSession.peutAjouterProduit()}" th:href="@{/produits/new}" class="btn btn-primary btn-sm">
                    <i class="fa fa-plus"></i> Nouveau produit
                </a>
            </div>
        </div>
        <div class="box-body no-padding">
            <table class="table table-striped" id="produitsTable">
                <thead>
                    <tr>
                        <th class="sortable" data-sort="id">ID <i class="fa fa-sort"></i></th>
                        <th class="sortable" data-sort="nom">Nom <i class="fa fa-sort"></i></th>
                        <th class="sortable" data-sort="description">Description <i class="fa fa-sort"></i></th>
                        <th class="sortable" data-sort="prix">Prix unitaire <i class="fa fa-sort"></i></th>
                        <th class="sortable" data-sort="quantite">Quantité <i class="fa fa-sort"></i></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="produit : ${produits}">
                        <td th:text="${produit.id}">1</td>
                        <td th:text="${produit.nom}">Nom</td>
                        <td th:text="${produit.description}">Description</td>
                        <td th:text="${#numbers.formatDecimal(produit.prixUnitaire, 1, 2)} + ' DH'">0.00</td>
                        <td th:text="${produit.quantite}"
                            th:classappend="${produit.quantite <= 5} ? 'text-danger fw-bold' : ''">0</td>
                        <td>
                            <a th:if="${@userSession.isAdmin() or @userSession.peutModifierProduit()}" th:href="@{/produits/edit/{id}(id=${produit.id})}" class="btn btn-xs btn-info">
                                <i class="fa fa-edit"></i> Edit
                            </a>
                            <a th:if="${@userSession.isAdmin() or @userSession.peutSupprimerProduit()}" th:href="@{/produits/delete/{id}(id=${produit.id})}" class="btn btn-xs btn-danger"
                               onclick="return confirm('Confirmer la suppression ?')">
                                <i class="fa fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(produits)}" class="text-center text-muted" style="padding: 20px;">
                Aucun produit trouvé.
            </p>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
var produits = [[${produits}]];
var stockData = [[${stockData}]];

var barLabels = produits.map(function(p) { return p.nom; });
var barData = produits.map(function(p) { return p.quantite; });
var barColors = barData.map(function(q) { return q <= 5 ? '#dd4b39' : '#00a65a'; });

var barCtx = document.getElementById('barChart');
if (barCtx) {
    new Chart(barCtx, {
        type: 'bar',
        data: {
            labels: barLabels,
            datasets: [{ label: 'Quantité en stock', data: barData, backgroundColor: barColors }]
        },
        options: {
            responsive: true,
            indexAxis: 'y',
            plugins: { legend: { display: false } },
            scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
}

var sortCol = null;
var sortAsc = true;

document.getElementById('produitsTable').querySelectorAll('.sortable').forEach(function(th) {
    th.addEventListener('click', function() {
        var col = th.getAttribute('data-sort');
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = true; }
        sortTable(col, sortAsc);
        var icon = th.querySelector('i');
        icon.className = sortAsc ? 'fa fa-sort-asc' : 'fa fa-sort-desc';
    });
});

function sortTable(col, asc) {
    var tbody = document.querySelector('#produitsTable tbody');
    var rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort(function(a, b) {
        var va, vb;
        switch (col) {
            case 'id': va = parseInt(a.cells[0].textContent); vb = parseInt(b.cells[0].textContent); break;
            case 'nom': va = a.cells[1].textContent.toLowerCase(); vb = b.cells[1].textContent.toLowerCase(); break;
            case 'description': va = a.cells[2].textContent.toLowerCase(); vb = b.cells[2].textContent.toLowerCase(); break;
            case 'prix': va = parseFloat(a.cells[3].textContent); vb = parseFloat(b.cells[3].textContent); break;
            case 'quantite': va = parseInt(a.cells[4].textContent); vb = parseInt(b.cells[4].textContent); break;
        }
        if (va < vb) return asc ? -1 : 1;
        if (va > vb) return asc ? 1 : -1;
        return 0;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
}

document.getElementById('searchInput').addEventListener('keyup', function() {
    var query = this.value.toLowerCase();
    var rows = document.querySelectorAll('#produitsTable tbody tr');
    rows.forEach(function(row) {
        var text = '';
        for (var i = 0; i < row.cells.length - 1; i++) {
            text += row.cells[i].textContent.toLowerCase() + ' ';
        }
        row.style.display = text.indexOf(query) > -1 ? '' : 'none';
    });
});
</script>
</th:block>
</body>
</html>
