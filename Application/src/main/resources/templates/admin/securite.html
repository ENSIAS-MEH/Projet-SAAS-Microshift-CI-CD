<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <title>Sécurité</title>
</head>
<body>
<section layout:fragment="header">
    <h1>
        Sécurité
        <small>Gestion des permissions</small>
    </h1>
    <ol class="breadcrumb">
        <li><a th:href="@{/dashboard}"><i class="fa fa-dashboard"></i> Home</a></li>
        <li class="active">Sécurité</li>
    </ol>
</section>
<div layout:fragment="content">

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="box box-primary">
        <div class="box-header with-border">
            <h3 class="box-title">Permissions par utilisateur</h3>
        </div>
        <div class="box-body">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom d'utilisateur</th>
                        <th>Nom</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${utilisateurs.content}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.username}">username</td>
                        <td th:text="${u.nom}">Nom</td>
                        <td>
                            <a th:href="@{/admin/securite/{id}(id=${u.id})}" class="btn btn-xs btn-warning">
                                <i class="fa fa-lock"></i> Gérer les permissions
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <ul class="pagination">
                <li th:each="i : ${#numbers.sequence(0, utilisateurs.totalPages - 1)}"
                    th:classappend="${i == utilisateurs.number} ? 'active'">
                    <a th:href="@{/admin/securite(page=${i})}" th:text="${i + 1}">1</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
