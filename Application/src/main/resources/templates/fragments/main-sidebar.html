<section class="sidebar">
    <div class="user-panel">
        <div class="pull-left info" style="padding-left: 0;">
            <p th:text="${@userSession.getUtilisateurConnecte()?.nom ?: @userSession.getUsername()}">User</p>
            <a href="#"><i class="fa fa-circle text-success"></i> Online</a>
        </div>
    </div>
    <form action="#" method="get" class="sidebar-form">
        <div class="input-group">
            <input type="text" name="q" class="form-control" placeholder="Search...">
            <span class="input-group-btn">
            <button type="submit" name="search" id="search-btn" class="btn btn-flat"><i class="fa fa-search"></i>
            </button>
          </span>
        </div>
    </form>
    <ul class="sidebar-menu">
        <li class="header">NAVIGATION PRINCIPALE</li>
        <li>
            <a th:href="@{/dashboard}">
                <i class="fa fa-dashboard"></i> <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a th:href="@{/produits}">
                <i class="fa fa-cube"></i> <span>Produits</span>
            </a>
        </li>
        <li>
            <a th:href="@{/commandes}">
                <i class="fa fa-shopping-cart"></i> <span>Commandes</span>
            </a>
        </li>
        <li class="header" th:if="${@userSession.isAdmin()}">ADMINISTRATION</li>
        <li th:if="${@userSession.isAdmin()}">
            <a th:href="@{/admin/utilisateurs}">
                <i class="fa fa-users"></i> <span>Utilisateurs</span>
            </a>
        </li>
        <li th:if="${@userSession.isAdmin()}">
            <a th:href="@{/admin/securite}">
                <i class="fa fa-shield"></i> <span>Sécurité</span>
            </a>
        </li>
        <li th:if="${@userSession.isAdmin()}">
            <a th:href="@{/admin/logs}">
                <i class="fa fa-history"></i> <span>Logs</span>
            </a>
        </li>
    </ul>
</section>
