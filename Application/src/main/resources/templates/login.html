<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            width: 360px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #3c8dbc;
        }
        .login-box-body {
            background: #fff;
            padding: 25px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .login-box-msg {
            text-align: center;
            margin-bottom: 15px;
            color: #666;
        }
        .btn-login {
            width: 100%;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-logo">
        <i class="fa fa-industry"></i> Usine SaaS
    </div>
    <div class="login-box-body">
        <p class="login-box-msg">Connectez-vous pour accéder à votre espace</p>

        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert alert-info" th:if="${infoMessage}" th:text="${infoMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group has-feedback">
                <input type="text" name="username" class="form-control" placeholder="Nom d'utilisateur" required autofocus>
                <span class="fa fa-user form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback">
                <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
                <span class="fa fa-lock form-control-feedback"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-login">
                <i class="fa fa-sign-in"></i> Se connecter
            </button>
        </form>
    </div>
</div>
</body>
</html>
